services:
  postgres:
    image: postgres:17-alpine
    container_name: recruiter-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recruiter_platform}
      POSTGRES_USER: ${POSTGRES_USER:-recruiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruiter}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruiter} -d ${POSTGRES_DB:-recruiter_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
